# Refund-claim adjudication task parameters, v2 (spec §12 hardening).
# Per-anchor policy sampling: window/tolerance/cap/scope drawn per anchor and stated in the
# prompt; delays derive from the sampled window. The default `policy` below is the fallback
# used when no sampling grid applies (tests, single-policy fixtures).
policy:
  claim_window_days: 14
  price_tolerance_cents: 5
  refund_cap_cents: null
  price_match_national_only: false
max_receipt_lines: 40
anchor_min_target_lines: 3
out_of_window_anchor_rate: 0.15
claims_per_anchor: 3
min_redemptions: 2
policy_window_days: [7, 14, 21, 30]
policy_tolerance_cents: [5, 10, 15, 25, 50]
policy_refund_caps_cents: [50, 75, 100, 150]
policy_national_only_prob: 0.5
stated_number_prob: 0.4
same_line_claim_prob: 0.35
in_window_type_shares:
  PRICE_MATCH: 21
  MISSED_COUPON: 28
  NOT_ON_RECEIPT: 14
  NEEDS_CLARIFICATION: 8
  WITHIN_TOLERANCE: 10
  NOT_ELIGIBLE: 8
  ALREADY_APPLIED: 4
